name: Deploy AI gateway nginx config

on:
  workflow_dispatch:

jobs:
  deploy-ai-gateway-nginx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload AI gateway nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.AI_GATEWAY_NGINX_ROOT_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "infra/nginx/toptry-ai-gateway.conf"
          target: "/tmp/toptry-ai-gateway-nginx-deploy"
          strip_components: 2
          rm: true

      - name: Validate and reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.AI_GATEWAY_NGINX_ROOT_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            test -f /tmp/toptry-ai-gateway-nginx-deploy/toptry-ai-gateway.conf

            TS="$(date -u +%Y%m%d-%H%M%S)"
            BACKUP="/etc/nginx/sites-available/toptry-ai-gateway.bak.${TS}"

            test -f /etc/nginx/sites-available/toptry-ai-gateway

            cp /etc/nginx/sites-available/toptry-ai-gateway "$BACKUP"
            cp /tmp/toptry-ai-gateway-nginx-deploy/toptry-ai-gateway.conf /etc/nginx/sites-available/toptry-ai-gateway

            if ! nginx -t; then
              cp "$BACKUP" /etc/nginx/sites-available/toptry-ai-gateway
              nginx -t
              exit 1
            fi

            if ! systemctl reload nginx; then
              cp "$BACKUP" /etc/nginx/sites-available/toptry-ai-gateway
              nginx -t
              systemctl reload nginx
              exit 1
            fi

            echo "AI gateway nginx config deployed and reloaded"
