server {
    listen 80;
    listen [::]:80;

    server_name ai-gateway.toptry.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ai-gateway.toptry.ru;

    ssl_certificate /etc/letsencrypt/live/ai-gateway.toptry.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-gateway.toptry.ru/privkey.pem;

    location /health {
        proxy_pass http://127.0.0.1:8090/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /internal/ai/pr-studio/text/structured {
        allow 194.87.226.47;
        deny all;

        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 630s;
        proxy_read_timeout 630s;
    }

    location /internal/ {
        allow 194.87.226.47;
        deny all;

        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location ^~ /staging/internal/ {
        allow 194.87.226.47;
        deny all;

        client_max_body_size 40m;

        proxy_pass http://127.0.0.1:8091/internal/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location / {
        return 404;
    }
}
